<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Market - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #070d1b;
            --card-bg: #111c38;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #233554;
            --input-bg: #090f1d;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-cyan: #06b6d4;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 70px;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .admin-container {
            display: none;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .bottom-nav a {
            color: var(--text-sub);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            transition: 0.2s;
        }

        .bottom-nav a i {
            font-size: 18px;
        }

        .bottom-nav a.active, .bottom-nav a:hover {
            color: var(--accent-blue);
        }

        .top-header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .main-content {
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card-box {
            background: linear-gradient(145deg, #132247, #0e1732);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: #ffffff !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
        }

        .form-control::placeholder, .form-select::placeholder {
            color: #64748b !important;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            color: #ffffff !important;
        }

        .table {
            color: #ffffff !important;
            vertical-align: middle;
            font-size: 13px;
        }

        .table th {
            background-color: var(--input-bg) !important;
            color: #ffffff !important;
            border-color: var(--border-color) !important;
            font-weight: 600;
            padding: 14px 12px;
        }

        .table td {
            background-color: transparent !important;
            border-color: var(--border-color) !important;
            color: #cbd5e1 !important;
            padding: 14px 12px;
        }

        .section-pane { display: none; }
        .section-pane.active { display: block; }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 55px; height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4, 8, 18, 0.85);
            backdrop-filter: blur(6px);
            z-index: 999999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .custom-alert-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            text-align: center;
        }
    </style>
</head>
<body>

<!-- GENERAL ALERT MODAL -->
<div id="custom-alert-overlay" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="text-white py-3 mb-3" style="font-size: 15px; word-break: break-all;"></div>
        <button onclick="closeCustomAlert()" class="btn btn-primary rounded-pill px-4 fw-bold w-100">OK</button>
    </div>
</div>

<!-- ADMIN AUTH SECTION -->
<div id="admin-auth-section" class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="stat-icon bg-danger bg-opacity-15 text-danger mx-auto mb-3" style="width: 65px; height: 65px; font-size: 28px;">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h4 class="fw-bold text-white">Admin Login</h4>
            <p class="text-sub small">Secure Admin Dashboard Access</p>
        </div>

        <div class="mb-3">
            <label class="small text-sub mb-1 fw-semibold">Admin Email</label>
            <input type="email" id="admin-auth-email" class="form-control" placeholder="admin@gmail.com">
        </div>
        <div class="mb-4">
            <label class="small text-sub mb-1 fw-semibold">Password</label>
            <input type="password" id="admin-auth-pass" class="form-control" placeholder="••••••••">
        </div>

        <button onclick="handleAdminLogin()" class="btn btn-danger w-100 fw-bold py-3 rounded-pill shadow">Login to Admin Panel</button>
    </div>
</div>

<!-- ADMIN CONTAINER DASHBOARD -->
<div id="admin-panel-container" class="admin-container">
    <div class="top-header">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-danger p-2 rounded-3 text-white d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="fw-bold fs-6 text-white">Admin Control Panel</span>
        </div>
        <button onclick="adminLogout()" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold">Logout</button>
    </div>

    <div class="main-content">
        <!-- Dashboard Overview Tab -->
        <div id="admin-section-dashboard" class="section-pane active">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-primary bg-opacity-15 text-primary"><i class="fa-solid fa-box"></i></div>
                        <div>
                            <div class="text-sub small">Total Stock Accounts</div>
                            <h4 class="fw-bold text-white m-0" id="stat-total-stock">0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-success bg-opacity-15 text-success"><i class="fa-solid fa-wallet"></i></div>
                        <div>
                            <div class="text-sub small">Total Deposits</div>
                            <h4 class="fw-bold text-white m-0" id="stat-total-deposit">৳0</h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-warning bg-opacity-15 text-warning"><i class="fa-solid fa-users"></i></div>
                        <div>
                            <div class="text-sub small">Total Users</div>
                            <h4 class="fw-bold text-white m-0" id="stat-total-users">0</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Manage Products Tab -->
        <div id="admin-section-products" class="section-pane">
            <div class="card-box">
                <h5 class="fw-bold mb-3 text-white"><i class="fa-solid fa-plus-circle text-primary me-2"></i>Add / Stock Accounts</h5>
                <div class="mb-3">
                    <label class="small text-sub mb-1 fw-semibold">Category Name</label>
                    <input type="text" id="admin-add-category" class="form-control" placeholder="e.g. Gmail Old Accounts">
                </div>
                <div class="mb-3">
                    <label class="small text-sub mb-1 fw-semibold">Price Per Unit (BDT)</label>
                    <input type="number" id="admin-add-price" class="form-control" placeholder="e.g. 15">
                </div>
                <div class="mb-3">
                    <label class="small text-sub mb-1 fw-semibold">Accounts (One per line: email:pass)</label>
                    <textarea id="admin-add-accounts" class="form-control" rows="5" placeholder="user1@gmail.com:pass123&#10;user2@gmail.com:pass456"></textarea>
                </div>
                <button onclick="addNewAccountsStock()" class="btn btn-primary w-100 fw-bold py-3 rounded-pill">Upload Stock</button>
            </div>
        </div>

        <!-- Deposits Approval Tab (With TrxID Search) -->
        <div id="admin-section-deposits" class="section-pane">
            <div class="card-box">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <h5 class="fw-bold m-0 text-white"><i class="fa-solid fa-money-bill-transfer text-success me-2"></i>Deposits Approval</h5>
                    <div style="width: 100%; max-width: 280px;">
                        <input type="text" id="admin-search-trx" class="form-control" placeholder="Search by TrxID..." oninput="filterDepositHistory()">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered mb-0">
                        <thead>
                            <tr>
                                <th>Method</th>
                                <th>Amount</th>
                                <th>TrxID</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-deposits-table-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="admin-section-settings" class="section-pane">
            <div class="card-box">
                <h5 class="fw-bold mb-3 text-white"><i class="fa-solid fa-gear text-info me-2"></i>Payment Gateway Numbers</h5>
                <div class="mb-3">
                    <label class="small text-sub mb-1 fw-semibold">bKash Number</label>
                    <input type="text" id="admin-gateway-bkash" class="form-control" placeholder="01XXXXXXXXX">
                </div>
                <div class="mb-3">
                    <label class="small text-sub mb-1 fw-semibold">Nagad Number</label>
                    <input type="text" id="admin-gateway-nagad" class="form-control" placeholder="01XXXXXXXXX">
                </div>
                <button onclick="saveGatewayNumbers()" class="btn btn-success w-100 fw-bold py-3 rounded-pill">Save Gateways</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" onclick="switchAdminTab('dashboard')" class="active" id="admin-menu-dashboard">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="#" onclick="switchAdminTab('products')" id="admin-menu-products">
            <i class="fa-solid fa-box-archive"></i>
            <span>Stock</span>
        </a>
        <a href="#" onclick="switchAdminTab('deposits')" id="admin-menu-deposits">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            <span>Deposits</span>
        </a>
        <a href="#" onclick="switchAdminTab('settings')" id="admin-menu-settings">
            <i class="fa-solid fa-sliders"></i>
            <span>Settings</span>
        </a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDCIMosLNehv92LBKawC-53ErJ13QhnJy0",
        authDomain: "mywebsite-709e3.firebaseapp.com",
        databaseURL: "https://mywebsite-709e3-default-rtdb.firebaseio.com",
        projectId: "mywebsite-709e3",
        storageBucket: "mywebsite-709e3.firebasestorage.app",
        messagingSenderId: "218299688364",
        appId: "1:218299688364:web:98aafc682ba92bf102c609",
        measurementId: "G-4LE965PQLF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allLoadedDeposits = [];

    function showCustomAlert(msg) {
        document.getElementById('custom-alert-message').innerText = msg;
        document.getElementById('custom-alert-overlay').style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('custom-alert-overlay').style.display = 'none';
    }

    function switchAdminTab(tabName) {
        document.querySelectorAll('.section-pane').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.bottom-nav a').forEach(el => el.classList.remove('active'));

        document.getElementById(`admin-section-${tabName}`).classList.add('active');
        document.getElementById(`admin-menu-${tabName}`).classList.add('active');
    }

    function handleAdminLogin() {
        let email = document.getElementById('admin-auth-email').value.trim();
        let pass = document.getElementById('admin-auth-pass').value.trim();

        if(email === "admin@gmail.com" && pass === "admin1234") {
            document.getElementById('admin-auth-section').style.display = 'none';
            document.getElementById('admin-panel-container').style.display = 'block';
            loadAdminData();
        } else {
            showCustomAlert('Invalid Admin Credentials!');
        }
    }

    function adminLogout() {
        document.getElementById('admin-panel-container').style.display = 'none';
        document.getElementById('admin-auth-section').style.display = 'flex';
    }

    function loadAdminData() {
        db.ref('deposits').on('value', snapshot => {
            let tbody = document.getElementById('admin-deposits-table-tbody');
            tbody.innerHTML = '';
            allLoadedDeposits = [];
            let totalDepSum = 0;

            if(snapshot.exists()) {
                snapshot.forEach(userSnap => {
                    userSnap.forEach(depSnap => {
                        let dep = depSnap.val();
                        dep.firebaseKey = depSnap.key;
                        dep.userUid = userSnap.key;
                        allLoadedDeposits.push(dep);

                        if(dep.status === 'Approved') {
                            totalDepSum += Number(dep.amount || 0);
                        }
                    });
                });
            }
            document.getElementById('stat-total-deposit').innerText = '৳' + totalDepSum;
            renderDepositsTable(allLoadedDeposits);
        });

        db.ref('products').on('value', snapshot => {
            let totalStock = 0;
            if(snapshot.exists()) {
                snapshot.forEach(catSnap => {
                    if(catSnap.val().accounts) {
                        totalStock += Object.keys(catSnap.val().accounts).length;
                    }
                });
            }
            document.getElementById('stat-total-stock').innerText = totalStock;
        });

        db.ref('users').on('value', snapshot => {
            let totalUsers = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
            document.getElementById('stat-total-users').innerText = totalUsers;
        });
    }

    function renderDepositsTable(depositsList) {
        let tbody = document.getElementById('admin-deposits-table-tbody');
        tbody.innerHTML = '';

        if(depositsList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-sub py-4">No deposit records found.</td></tr>`;
            return;
        }

        depositsList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        depositsList.forEach(dep => {
            let realTrxId = dep.trxId || dep.transactionId || dep.trxID || dep.id || 'N/A';
            let badgeColor = dep.status === 'Approved' ? 'bg-success' : dep.status === 'Rejected' ? 'bg-danger' : 'bg-warning text-dark';
            
            let actionHtml = '';
            if(dep.status === 'Pending' || !dep.status) {
                actionHtml = `
                    <button onclick="approveDeposit('${dep.userUid}', '${dep.firebaseKey}', ${dep.amount})" class="btn btn-sm btn-success rounded-pill px-3 fw-bold me-1">Approve</button>
                    <button onclick="rejectDeposit('${dep.userUid}', '${dep.firebaseKey}')" class="btn btn-sm btn-danger rounded-pill px-3 fw-bold">Reject</button>
                `;
            } else {
                actionHtml = `<span class="fw-bold text-sub">${dep.status}</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td>${dep.method || 'bKash'}</td>
                    <td class="fw-bold text-white">৳${dep.amount || 0}</td>
                    <td class="font-monospace text-info">${realTrxId}</td>
                    <td><span class="badge ${badgeColor} px-2 py-1">${dep.status || 'Pending'}</span></td>
                    <td>${actionHtml}</td>
                </tr>
            `;
        });
    }

    function filterDepositHistory() {
        let keyword = document.getElementById('admin-search-trx').value.toLowerCase().trim();
        let filtered = allLoadedDeposits.filter(dep => {
            let tId = (dep.trxId || dep.transactionId || dep.trxID || dep.id || '').toLowerCase();
            return tId.includes(keyword);
        });
        renderDepositsTable(filtered);
    }

    function approveDeposit(userUid, depKey, amount) {
        db.ref(`users/${userUid}/balance`).once('value').then(snap => {
            let currentBal = Number(snap.val() || 0);
            let newBal = currentBal + Number(amount);

            let updates = {};
            updates[`users/${userUid}/balance`] = newBal;
            updates[`deposits/${userUid}/${depKey}/status`] = 'Approved';

            db.ref().update(updates).then(() => {
                showCustomAlert('Deposit Approved & Balance Added Successfully!');
            });
        });
    }

    function rejectDeposit(userUid, depKey) {
        db.ref(`deposits/${userUid}/${depKey}/status`).set('Rejected').then(() => {
            showCustomAlert('Deposit Rejected Successfully.');
        });
    }

    function addNewAccountsStock() {
        let categoryName = document.getElementById('admin-add-category').value.trim();
        let price = Number(document.getElementById('admin-add-price').value);
        let rawAccs = document.getElementById('admin-add-accounts').value.trim();

        if(!categoryName || !price || !rawAccs) {
            showCustomAlert('Please fill in all fields correctly!');
            return;
        }

        let lines = rawAccs.split('\n');
        let accountsObj = {};
        lines.forEach(line => {
            if(line.trim() !== '') {
                let pushKey = db.ref().child('tmp').push().key;
                accountsObj[pushKey] = line.trim();
            }
        });

        let catKey = categoryName.toLowerCase().replace(/[^a-z0-9]/g, '_');
        
        db.ref(`products/${catKey}`).set({
            name: categoryName,
            price: price,
            accounts: accountsObj
        }).then(() => {
            showCustomAlert('Stock Uploaded Successfully!');
            document.getElementById('admin-add-category').value = '';
            document.getElementById('admin-add-price').value = '';
            document.getElementById('admin-add-accounts').value = '';
        });
    }

    function saveGatewayNumbers() {
        let bkash = document.getElementById('admin-gateway-bkash').value.trim();
        let nagad = document.getElementById('admin-gateway-nagad').value.trim();

        db.ref('settings/gateways').set({
            bkash: bkash,
            nagad: nagad
        }).then(() => {
            showCustomAlert('Payment Gateway Numbers Saved Successfully!');
        });
    }
</script>
</body>
</html>
